services:
  homarr:
    container_name: homarr
    restart: unless-stopped
    image: ghcr.io/homarr-labs/homarr:v2.6.0
    env_file: secrets.enc.env
    volumes:
      - /home/diego/services_data/dashboards/homarr/appdata:/appdata
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "homarr --version || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.homarr.rule=Host(`homarr.local.dynabase.nl`)"
      - "traefik.http.routers.homarr.entrypoints=https"
      - "traefik.http.routers.homarr.tls=true"
      - "traefik.http.services.homarr.loadbalancer.server.port=7575"

  glance:
    container_name: glance
    image: glanceapp/glance:v0.8.7
    restart: unless-stopped
    entrypoint: ["/app/glance", "--config", "/app/config/glance.yaml"]
    volumes:
      - ./glance:/app/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/api/healthz || exit 1
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.glance.rule=Host(`glance.local.dynabase.nl`)"
      - "traefik.http.routers.glance.entrypoints=https"
      - "traefik.http.routers.glance.tls=true"
      - "traefik.http.services.glance.loadbalancer.server.port=8080"

  larapaper:
    container_name: larapaper
    image: ghcr.io/usetrmnl/larapaper:0.45.1
    restart: unless-stopped
    env_file: secrets.enc.env
    environment:
      - APP_URL=https://larapaper.local.dynabase.nl
      - FORCE_HTTPS=true
      - PHP_OPCACHE_ENABLE=1
      - DB_DATABASE=database/storage/database.sqlite
    volumes:
      - /home/diego/services_data/dashboards/larapaper/database:/var/www/html/database/storage
      - /home/diego/services_data/dashboards/larapaper/generated:/var/www/html/storage/app/public/images/generated
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/up"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.larapaper.rule=Host(`larapaper.local.dynabase.nl`)"
      - "traefik.http.routers.larapaper.entrypoints=https"
      - "traefik.http.routers.larapaper.tls=true"
      - "traefik.http.services.larapaper.loadbalancer.server.port=8080"

networks:
  default:
    name: home_server_network
    driver: bridge
    external: true
