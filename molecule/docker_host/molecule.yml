---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: test_ansible_role_docker_host
    image: geerlingguy/docker-ubuntu2404-ansible:latest
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        username: test_user
        # The real data disks do not exist in the test container, and a hard
        # RequiresMountsFor on a missing mount unit would stop Docker starting.
        # Exercise the ordering-only path against a mount that always exists.
        docker_host_required_mounts: []
        docker_host_ordered_mounts:
          - /tmp
  env:
    ANSIBLE_CONFIG: ../../ansible.cfg

verifier:
  name: ansible
