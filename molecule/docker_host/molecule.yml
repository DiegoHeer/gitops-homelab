---
dependency:
  name: galaxy

driver:
  name: docker

platforms:
  - name: test_ansible_role_docker_host
    image: geerlingguy/docker-${MOLECULE_DISTRO:-ubuntu2604}-ansible:latest
    privileged: true
    pre_build_image: true
    cgroupns_mode: host
    command: ${MOLECULE_DOCKER_COMMAND:-""}
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw

provisioner:
  name: ansible
  inventory:
    group_vars:
      all:
        username: test_user
        # /tmp is a real mount in this image (Ansible's mount facts skip tmpfs); it stands in for the data disks.
        docker_host_required_mounts:
          - /tmp
        # Nested Docker cannot unpack image layers onto overlayfs inside the test container.
        docker_host_daemon_config_extra:
          storage-driver: vfs
          features:
            containerd-snapshotter: false
  env:
    ANSIBLE_CONFIG: ../../ansible.cfg

verifier:
  name: ansible
