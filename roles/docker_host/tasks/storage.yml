---
# Docker must not start before the data disks are mounted. If it does, every
# bind mount under /media/* resolves to the empty mountpoint on the root disk
# and containers silently serve from the wrong directory — no error, no restart
# loop, just wrong data (and writes landing on the root filesystem).

- name: Ensure the docker.service drop-in directory exists
  ansible.builtin.file:
    path: /etc/systemd/system/docker.service.d
    state: directory
    owner: root
    group: root
    mode: "0755"
  # Explicit length checks: a bare `list or list` yields a list, and Ansible
  # rejects a non-boolean conditional result.
  when: (docker_host_required_mounts | length > 0) or (docker_host_ordered_mounts | length > 0)

- name: Order Docker after the data disk mounts
  ansible.builtin.template:
    src: docker-wait-for-mounts.conf.j2
    dest: /etc/systemd/system/docker.service.d/10-wait-for-mounts.conf
    owner: root
    group: root
    mode: "0644"
  # Explicit length checks: a bare `list or list` yields a list, and Ansible
  # rejects a non-boolean conditional result.
  when: (docker_host_required_mounts | length > 0) or (docker_host_ordered_mounts | length > 0)
  notify: Reload systemd unit files
