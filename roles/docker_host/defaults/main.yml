---
# All service stacks except gitops/ are DocoCD-managed (see .doco-cd.yml).
# This role now only bootstraps the gitops stack plus host-level prerequisites
# (Docker, shared network, SOPS age key, cloudflared tunnel token).

# Mounts Docker must wait for before starting, so containers never bind-mount a
# pre-mount directory. Required: absence is a hard failure. Ordered: Docker
# waits for the mount attempt but still starts if it fails.
docker_host_required_mounts:
  - /media/hd1
  - /media/hd2
docker_host_ordered_mounts:
  - /media/hd3
